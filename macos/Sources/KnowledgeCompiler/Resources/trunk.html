<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --text-primary: #e6f9f9;
    --text-secondary: #8ab8b8;
    --accent-cyan: #4dffd2;
    --accent-aqua: #00f0ff;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body { font-family: 'Avenir Next', -apple-system, sans-serif; font-weight: 200; text-transform: lowercase; }
  #stage { width: 100%; height: 100%; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage.hovering { cursor: pointer; }
  #gateway {
    position: absolute;
    pointer-events: none;
    max-width: 280px;
    padding: 10px 14px;
    background: rgba(4, 28, 28, 0.92);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0, 240, 255, 0.22);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 24px rgba(0,240,255,0.12);
    color: var(--text-primary);
    opacity: 0;
    transition: opacity 0.22s cubic-bezier(0.25,0.8,0.25,1);
    z-index: 10;
  }
  #gateway::after {
    content: '';
    position: absolute; inset: 5px;
    border: 1px dashed rgba(0, 240, 255, 0.18);
    border-radius: 8px;
  }
  #gateway .g-label {
    font-size: 7px; letter-spacing: 1.8px; color: var(--accent-cyan);
    text-shadow: 0 0 10px rgba(77,255,210,0.6); margin-bottom: 4px;
  }
  #gateway .g-title { font-size: 14px; font-weight: 400; line-height: 1.3; }
  #gateway .g-meta { font-size: 9px; color: var(--text-secondary); margin-top: 5px; font-family: ui-monospace, monospace; }
  #empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-secondary); gap: 5px; pointer-events: none;
    transition: opacity 0.4s;
  }
  #empty .e-big { font-size: 18px; font-weight: 100; opacity: 0.85; }
  #empty .e-small { font-size: 10px; opacity: 0.5; }
  #altitude {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; opacity: 0.5;
  }
  #altitude .a-track { width: 1.5px; height: 140px; background: rgba(0,240,255,0.2); position: relative; }
  #altitude .a-dot {
    position: absolute; left: -3px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-cyan); box-shadow: 0 0 12px rgba(77,255,210,0.9);
    transition: top 0.15s linear;
  }
  #altitude .a-label { font-size: 7px; color: var(--text-secondary); letter-spacing: 1.2px; writing-mode: vertical-rl; }
  #forest-toggle {
    position: absolute; left: 14px; bottom: 14px; z-index: 20;
    padding: 8px 14px;
    background: rgba(4, 28, 28, 0.85);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(0, 240, 255, 0.18);
    border-radius: 8px;
    color: var(--accent-cyan);
    font-family: inherit; font-size: 11px; font-weight: 400; letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  #forest-toggle:hover { background: rgba(4, 28, 28, 0.95); border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0,240,255,0.15); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="gateway">
  <div class="g-label">conceptual gateway</div>
  <div class="g-title"></div>
  <div class="g-meta"></div>
</div>
<div id="empty">
  <div class="e-big">the trunk awaits its rings</div>
  <div class="e-small">compile knowledge to grow bark</div>
</div>
<div id="altitude">
  <div class="a-track"><div class="a-dot" style="top:134px"></div></div>
  <div class="a-label">ascent</div>
</div>
<button id="forest-toggle">show forest</button>
<script src="three.min.js"></script>
<script>
"use strict";
function post(msg) {
  try { window.webkit.messageHandlers.trunk.postMessage(msg); } catch (e) {}
}
window.onerror = function (message, source, line) {
  post({ type: "log", level: "error", message: "trunk model: " + message + " (line " + line + ")" });
};

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, octaves = 5, lacunarity = 2.1, gain = 0.52) {
  let total = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    total += vnoise(x * freq, y * freq) * amp;
    amp *= gain; freq *= lacunarity;
  }
  return total;
}
function strHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
const PITCH_PER_NODE = 0.58;
const K_HELIX = PITCH_PER_NODE / GOLDEN;
const RADIUS = 1.85;

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 100);
camera.position.set(0, 0.35, RADIUS * 3.8);
camera.lookAt(0, 0, 0);

const keyLight = new THREE.DirectionalLight(0x9ffcf0, 2.2);
keyLight.position.set(3.2, 4.5, 4.8);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x00f0ff, 0.9);
rimLight.position.set(-4.5, -1.5, -2.8);
scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x082525, 2.0));
const glowLight = new THREE.PointLight(0x4dffd2, 0.0, 10);
glowLight.position.set(0, 0, RADIUS * 1.6);
scene.add(glowLight);

const trunkGroup = new THREE.Group();
scene.add(trunkGroup);
const forestGroup = new THREE.Group();
scene.add(forestGroup);

let graphNodes = [];
let placed = [];
let markers = [];
let trunkMesh = null;
let edgeLines = null;
let theta = 0;
let thetaTarget = 0;
let thetaMin = 0, thetaMax = 0;
let spinVelocity = 0;
let forestMode = false;
let forestTrees = [];

const forestToggle = document.getElementById("forest-toggle");

function swayX(y) { return 0.22 * Math.sin(y * 0.31) + 0.12 * Math.sin(y * 0.113 + 2.1); }
function swayZ(y) { return 0.20 * Math.cos(y * 0.27 + 1.3) + 0.10 * Math.sin(y * 0.091); }
function baseRadius(y, height) {
  const taper = 1 - 0.14 * (y / Math.max(height, 1));
  return RADIUS * taper * (1 + 0.06 * Math.sin(y * 0.52 + 0.7));
}

function angleDist(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function disposeTrunk() {
  if (trunkMesh) { trunkGroup.remove(trunkMesh); trunkMesh.geometry.dispose(); if (trunkMesh.material) trunkMesh.material.dispose(); }
  if (edgeLines) { trunkGroup.remove(edgeLines); edgeLines.geometry.dispose(); if (edgeLines.material) edgeLines.material.dispose(); }
  for (const p of placed) {
    if (p.marker) trunkGroup.remove(p.marker);
    if (p.dot) trunkGroup.remove(p.dot);
  }
  trunkMesh = null; edgeLines = null; placed = []; markers = [];
}

function disposeForest() {
  while (forestGroup.children.length) {
    const child = forestGroup.children[0];
    forestGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  }
  forestTrees = [];
}

window.setGraph = function (graph) {
  disposeTrunk();
  graphNodes = graph.nodes || [];
  const edges = graph.edges || [];
  document.getElementById("empty").style.opacity = graphNodes.length ? 0 : 1;
  if (!graphNodes.length) { thetaMin = thetaMax = thetaTarget = theta = 0; return; }

  const ordered = graphNodes.slice().sort(function (a, b) {
    return (a.depth - b.depth) || (a.order - b.order);
  });
  const n = ordered.length;
  const maxChars = Math.max.apply(null, ordered.map(function (m) { return m.chars; }).concat([1]));
  const height = n * PITCH_PER_NODE + 9;
  const yBase = -2.5;

  placed = ordered.map(function (node, i) {
    const jitter = (hash2(strHash(node.id) % 977, 13.7) - 0.5) * 0.28;
    const weight = Math.pow(Math.min(node.chars / maxChars, 1), 0.5);
    return {
      node: node,
      angle: i * GOLDEN,
      y: yBase + 2 + i * PITCH_PER_NODE + jitter,
      sigma: 0.15 + 0.32 * weight,
      amp: 0.09 + 0.28 * weight,
    };
  });

  const radialSegs = 512;
  const heightSegs = Math.min(Math.max(Math.round(height * 10), 120), 720);
  const geo = new THREE.CylinderGeometry(1, 1, height, radialSegs, heightSegs, true);
  geo.translate(0, height / 2 + yBase, 0);
  const pos = geo.attributes.position;
  const uvs = geo.attributes.uv;

  const vertexShader = `
    uniform float uHeight;
    uniform float uYBase;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;
    // hash & noise
    float hash2(vec2 p) {
      vec2 n = vec2(127.1, 311.7);
      float s = sin(dot(p, n)) * 43758.5453123;
      return fract(s);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash2(i);
      float b = hash2(i + vec2(1.0, 0.0));
      float c = hash2(i + vec2(0.0, 1.0));
      float d = hash2(i + vec2(1.0, 1.0));
      return a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y;
    }
    float fbm(vec2 p, int octaves, float lacunarity, float gain) {
      float total = 0.0;
      float amp = 0.5;
      float freq = 1.0;
      for (int i = 0; i < 6; i++) {
        if (i >= octaves) break;
        total += vnoise(p * freq) * amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return total;
    }
    void main() {
      vUv = uv;
      vec3 objectNormal = normal;
      vec3 p = position;
      float y = p.y;
      float height = uHeight;
      float yBase = uYBase;
      float r = 1.0;
      float ang = atan(p.x, p.z);
      float age = 1.0 - (y - yBase) / height;
      float drift = fbm(vec2(y * 0.16, 3.3), 4, 2.03, 0.52) * 4.0;
      float ridge = abs(sin(ang * 9.0 + drift + fbm(vec2(ang * 2.2, y * 0.5), 3, 2.1, 0.52) * 2.4));
      float grain = fbm(vec2(ang * 3.1 + 11.7, y * 1.15), 4, 2.2, 0.5);
      float baseR = 1.0 - 0.14 * (y / max(height, 1.0));
      r = baseR * (1.0 + 0.06 * sin(y * 0.52 + 0.7));
      r += (0.30 + 0.35 * age) * 0.16 * (1.0 - ridge);
      r += 0.10 * (grain - 0.5);
      r += 0.035 * (0.5 + 0.5 * age) * (vnoise(vec2(ang * 14.0, y * 6.0)) - 0.5);
      float k1 = (sin(y * 0.18) * 0.08 + cos(y * 0.11) * 0.04);
      float k2 = (sin(y * 0.13 + 1.7) * 0.06 + cos(y * 0.09) * 0.03);
      r += k1 + k2;
      vec3 displaced = vec3(p.x * r, p.y, p.z * r);
      displaced.x += 0.22 * sin(y * 0.31) + 0.12 * sin(y * 0.113 + 2.1);
      displaced.z += 0.20 * cos(y * 0.27 + 1.3) + 0.10 * sin(y * 0.091);
      vWorldPos = (modelMatrix * vec4(displaced, 1.0)).xyz;
      vNormal = normalize(mat3(modelMatrix) * objectNormal);
      vHeight = (y - yBase) / height;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
    }
  `;

  const fragmentShader = `
    uniform float uHeight;
    uniform float uYBase;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;
    float hash2(vec2 p) {
      vec2 n = vec2(127.1, 311.7);
      float s = sin(dot(p, n)) * 43758.5453123;
      return fract(s);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash2(i);
      float b = hash2(i + vec2(1.0, 0.0));
      float c = hash2(i + vec2(0.0, 1.0));
      float d = hash2(i + vec2(1.0, 1.0));
      return a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y;
    }
    float fbm(vec2 p, int octaves, float lacunarity, float gain) {
      float total = 0.0;
      float amp = 0.5;
      float freq = 1.0;
      for (int i = 0; i < 6; i++) {
        if (i >= octaves) break;
        total += vnoise(p * freq) * amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return total;
    }
    vec3 barkDeep = vec3(0.024, 0.106, 0.106);
    vec3 barkMid  = vec3(0.051, 0.208, 0.204);
    vec3 barkLit  = vec3(0.102, 0.353, 0.322);
    vec3 glowCol  = vec3(0.302, 1.0, 0.824);
    vec3 knotCol  = vec3(0.15, 0.08, 0.04);
    vec3 mossCol  = vec3(0.08, 0.18, 0.06);
    vec3 lichenCol = vec3(0.35, 0.45, 0.25);
    vec3 acesFilm(vec3 x) {
      float a = 2.51; float b = 0.03; float c = 2.43; float d = 0.59; float e = 0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
    }
    void main() {
      float y = vWorldPos.y;
      float ang = atan(vWorldPos.x, vWorldPos.z);
      float age = 1.0 - vHeight;
      float drift = fbm(vec2(y * 0.16, 3.3), 4, 2.03, 0.52) * 4.0;
      float ridge = abs(sin(ang * 9.0 + drift + fbm(vec2(ang * 2.2, y * 0.5), 3, 2.1, 0.52) * 2.4));
      float grain = fbm(vec2(ang * 3.1 + 11.7, y * 1.15), 4, 2.2, 0.5);
      float micro = fbm(vec2(ang * 12.0, y * 4.0), 3, 2.0, 0.5) * 0.08;
      float crest = 1.0 - ridge;
      vec3 base = mix(barkDeep, barkMid, 0.35 + 0.65 * crest);
      base = mix(base, barkLit, crest * crest * 0.4 * (1.0 - age * 0.5));
      float knot = step(0.72, fbm(vec2(ang * 5.0 + 3.1, y * 2.5), 4, 2.3, 0.5));
      base = mix(base, knotCol, knot * 0.7);
      float moss = smoothstep(0.65, 0.85, fbm(vec2(ang * 7.0, y * 1.5 + 10.0), 3, 2.1, 0.5));
      base = mix(base, mossCol, moss * 0.25 * (1.0 - age));
      float lichen = step(0.82, fbm(vec2(ang * 4.0, y * 1.2 + 5.0), 3, 2.2, 0.5));
      base = mix(base, lichenCol, lichen * 0.15);
      base += micro * 0.04;
      float indent = 0.0;
      for (int i = 0; i < 50; i++) {
        if (i >= int(uHeight * 5.0)) break;
      }
      gl_FragColor = vec4(acesFilm(base), 1.0);
    }
  `;

  const barkMaterial = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      uHeight: { value: height },
      uYBase: { value: yBase },
      uTime: { value: 0 },
    },
    side: THREE.FrontSide,
    flatShading: false,
  });

  trunkMesh = new THREE.Mesh(geo, barkMaterial);
  trunkGroup.add(trunkMesh);
  buildMarkersAndEdges(edges, height);

  thetaMin = -(n - 1) * GOLDEN - 0.8;
  thetaMax = 0.8;
  thetaTarget = Math.max(thetaMin, Math.min(thetaMax, thetaTarget));
  post({ type: "log", level: "info", message: "trunk grown — " + n + " memories carved into the bark" });
};

function surfacePoint(angle, y, height, lift) {
  const r = baseRadius(y, height) + (lift || 0.06);
  return new THREE.Vector3(Math.sin(angle) * r + swayX(y), y, Math.cos(angle) * r + swayZ(y));
}

function buildMarkersAndEdges(edges, height) {
  const markerMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.0, depthWrite: false });
  for (const p of placed) {
    const center = surfacePoint(p.angle, p.y, height, -p.amp * 0.5);
    const marker = new THREE.Mesh(new THREE.SphereGeometry(Math.max(p.sigma * 1.35, 0.24), 10, 10), markerMat.clone());
    marker.position.copy(center);
    marker.userData.nodeId = p.node.id;
    trunkGroup.add(marker);
    markers.push(marker);
    p.marker = marker;

    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.035 + p.sigma * 0.12, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x4dffd2, transparent: true, opacity: 0.5 })
    );
    dot.position.copy(surfacePoint(p.angle, p.y, height, 0.02 - p.amp * 0.6));
    trunkGroup.add(dot);
    p.dot = dot;
  }

  const byId = {};
  for (const p of placed) byId[p.node.id] = p;
  const pts = [];
  let drawn = 0;
  for (const e of edges) {
    const a = byId[e.source], b = byId[e.target];
    if (!a || !b || drawn > 400) continue;
    drawn++;
    const steps = 14;
    for (let s = 0; s < steps; s++) {
      const t0 = s / steps, t1 = (s + 1) / steps;
      for (const t of [t0, t1]) {
        const ang = a.angle + (b.angle - a.angle) * t;
        const y = a.y + (b.y - a.y) * t;
        const bulge = 0.10 * Math.sin(Math.PI * t);
        pts.push(surfacePoint(ang, y, height, 0.05 + bulge));
      }
    }
  }
  if (pts.length) {
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    edgeLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color: 0x00f0ff, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending,
    }));
    trunkGroup.add(edgeLines);
  }
}

window.setForest = function (trees) {
  disposeForest();
  forestTrees = trees || [];
  if (!forestTrees.length) return;
  const count = forestTrees.length;
  const forestRadius = 6.5;
  for (let i = 0; i < count; i++) {
    const tree = forestTrees[i];
    const angle = (i / count) * Math.PI * 2;
    const x = forestRadius * Math.cos(angle);
    const z = forestRadius * Math.sin(angle);
    const height = 1.5 + Math.min(tree.nodeCount * 0.05, 4.0);
    const base = 0.4 + Math.min(tree.nodeCount * 0.01, 1.0);
    const tint = tree.species === "cedar" ? 0xc8d8e8 : tree.species === "ash" ? 0xe0e0dc : tree.species === "beech" ? 0xf2f0e0 : 0xffffff;
    const miniGeo = new THREE.CylinderGeometry(base * 0.7, base, height, 32, 16, true);
    miniGeo.translate(0, height / 2, 0);
    const miniMat = new THREE.MeshStandardMaterial({
      color: tint, roughness: 0.7, metalness: 0.0, flatShading: true,
    });
    const cone = new THREE.Mesh(miniGeo, miniMat);
    cone.position.set(x, 0, z);
    cone.userData.forestId = tree.id;
    forestGroup.add(cone);

    const labelGeo = new THREE.PlaneGeometry(2, 0.4);
    const labelMat = new THREE.MeshBasicMaterial({ color: 0xd8d0b8, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    const label = new THREE.Mesh(labelGeo, labelMat);
    label.position.set(x, height / 2 + 0.5, z);
    label.lookAt(camera.position);
    label.userData.forestId = tree.id;
    forestGroup.add(label);
  }
};

function clampTheta(t) { return Math.max(thetaMin, Math.min(thetaMax, t)); }

const gateway = document.getElementById("gateway");
const altitudeDot = document.querySelector("#altitude .a-dot");
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2, -2);
let pointerClient = { x: 0, y: 0 };
let dragging = false, dragMoved = 0, lastX = 0, downTime = 0;
let hoveredId = null;

stage.addEventListener("pointerdown", function (e) {
  dragging = true; dragMoved = 0; lastX = e.clientX; downTime = performance.now();
  spinVelocity = 0;
  stage.classList.add("dragging");
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", function (e) {
  pointerClient = { x: e.clientX, y: e.clientY };
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  if (dragging) {
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    dragMoved += Math.abs(dx);
    const dTheta = dx * 0.0075;
    thetaTarget = clampTheta(thetaTarget + dTheta);
    spinVelocity = dTheta;
  }
});
stage.addEventListener("pointerup", function (e) {
  stage.classList.remove("dragging");
  const quick = performance.now() - downTime < 350;
  if (dragging && dragMoved < 4 && quick && hoveredId) {
    post({ type: "open", id: hoveredId });
  }
  dragging = false;
});
stage.addEventListener("pointerleave", function () {
  dragging = false;
  stage.classList.remove("dragging");
  pointer.x = -2; pointer.y = -2;
});
stage.addEventListener("wheel", function (e) {
  e.preventDefault();
  thetaTarget = clampTheta(thetaTarget + e.deltaY * 0.004);
}, { passive: false });

forestToggle.addEventListener("click", function () {
  forestMode = !forestMode;
  forestToggle.textContent = forestMode ? "show graph" : "show forest";
  post({ type: "forestToggle", mode: forestMode });
  if (trunkMesh) trunkMesh.visible = !forestMode;
  if (edgeLines) edgeLines.visible = !forestMode;
  for (const p of placed) {
    if (p.marker) p.marker.visible = !forestMode;
    if (p.dot) p.dot.visible = !forestMode;
  }
  forestGroup.visible = forestMode;
});

function updateHover() {
  if (!markers.length || dragging) { if (dragging) return; }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(markers, false);
  const hit = hits.length ? hits[0].object : null;
  const id = hit ? hit.userData.nodeId : null;
  if (id !== hoveredId) {
    hoveredId = id;
    stage.classList.toggle("hovering", !!id);
    if (id) {
      const p = placed.find(function (q) { return q.node.id === id; });
      if (p) {
        gateway.querySelector(".g-title").textContent = p.node.title;
        gateway.querySelector(".g-meta").textContent =
          "d" + p.node.depth + " · " + p.node.chars + " chars · " + p.node.host;
        gateway.style.opacity = 1;
        glowLight.intensity = 1.6;
        p.dot.material.opacity = 1;
        p.dot.scale.setScalar(1.8);
      }
    } else {
      gateway.style.opacity = 0;
      glowLight.intensity = 0;
      for (const p of placed) { p.dot.material.opacity = 0.5; p.dot.scale.setScalar(1); }
    }
  }
  if (hoveredId) {
    gateway.style.left = Math.min(pointerClient.x + 18, stage.clientWidth - 300) + "px";
    gateway.style.top = Math.max(pointerClient.y - 16, 8) + "px";
  }
}

function resize() {
  const w = stage.clientWidth || 2, h = stage.clientHeight || 2;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let lastFrame = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  if (!dragging && Math.abs(spinVelocity) > 0.00004) {
    thetaTarget = clampTheta(thetaTarget + spinVelocity);
    spinVelocity *= Math.pow(0.052, dt);
  }
  theta += (thetaTarget - theta) * Math.min(dt * 7.5, 1);

  trunkGroup.rotation.y = theta;
  trunkGroup.position.y = theta * K_HELIX;

  if (trunkMesh && trunkMesh.material && trunkMesh.material.uniforms) {
    trunkMesh.material.uniforms.uTime.value = now * 0.001;
  }

  if (thetaMax > thetaMin) {
    const progress = (thetaMax - theta) / (thetaMax - thetaMin);
    altitudeDot.style.top = (134 - progress * 134) + "px";
  }

  updateHover();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
post({ type: "ready" });
</script>
</body>
